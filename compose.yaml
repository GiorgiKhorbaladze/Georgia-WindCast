# Georgia WindCast - local and private-pilot stack.
# Usage: cp .env.example .env, replace secrets, then: docker compose up --build -d
name: windcast

x-backend-env: &backend-env
  WINDCAST_APP_ENV: ${WINDCAST_APP_ENV:-production}
  WINDCAST_ALLOW_FIXTURES: "false"
  WINDCAST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-windcast}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-windcast}
  WINDCAST_WORKER_HEARTBEAT_SECONDS: ${WINDCAST_WORKER_HEARTBEAT_SECONDS:-30}
  WINDCAST_WORKER_STALE_AFTER_SECONDS: ${WINDCAST_WORKER_STALE_AFTER_SECONDS:-120}
  WINDCAST_GSE_INGESTION_ENABLED: ${WINDCAST_GSE_INGESTION_ENABLED:-false}
  WINDCAST_GSE_POLL_SECONDS: ${WINDCAST_GSE_POLL_SECONDS:-60}
  WINDCAST_GSE_FRESH_WITHIN_SECONDS: ${WINDCAST_GSE_FRESH_WITHIN_SECONDS:-600}
  WINDCAST_GSE_USER_AGENT: ${WINDCAST_GSE_USER_AGENT:-}
  WINDCAST_WEATHER_INGESTION_ENABLED: ${WINDCAST_WEATHER_INGESTION_ENABLED:-false}
  WINDCAST_WEATHER_POLL_SECONDS: ${WINDCAST_WEATHER_POLL_SECONDS:-900}
  WINDCAST_WEATHER_USER_AGENT: ${WINDCAST_WEATHER_USER_AGENT:-}
  WINDCAST_LOG_LEVEL: ${WINDCAST_LOG_LEVEL:-INFO}

services:
  db:
    # The official PostgreSQL image, hardened: runs as "postgres" (never root), no gosu, OS
    # updates applied. POSTGRES_IMAGE overrides the pinned base (e.g. a registry mirror).
    build:
      context: ./deploy/postgres
      args:
        POSTGRES_IMAGE: ${POSTGRES_IMAGE:-postgres:17.12-alpine3.24@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7}
    image: windcast-postgres:${WINDCAST_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-windcast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-windcast}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12.16-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b}
    image: windcast-backend:${WINDCAST_IMAGE_TAG:-local}
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    # One-shot job: the image's HTTP healthcheck belongs to the API and would only report noise.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: windcast-backend:${WINDCAST_IMAGE_TAG:-local}
    pull_policy: never  # built by the migrate service
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"

  worker:
    image: windcast-backend:${WINDCAST_IMAGE_TAG:-local}
    pull_policy: never  # built by the migrate service
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment: *backend-env
    healthcheck:
      # Age of the liveness file the worker touches after each committed DB heartbeat. A shell
      # test, so a probe never starts Python (a cold import of the worker stack took ~22 s under
      # QEMU). Database-level check: docker compose exec worker python -m app.healthcheck
      test:
        - CMD-SHELL
        - f=$${WINDCAST_WORKER_ALIVE_FILE:-/tmp/windcast-worker.alive}; [ -f "$$f" ] && [ $$(( $$(date +%s) - $$(stat -c %Y "$$f") )) -le $${WINDCAST_WORKER_STALE_AFTER_SECONDS:-120} ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22.23.5-alpine3.24@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a}
    image: windcast-frontend:${WINDCAST_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      WINDCAST_API_URL: http://api:8000
      # Public identity (issue #18). Empty = private pilot: no canonical URLs, noindex.
      WINDCAST_PUBLIC_URL: ${WINDCAST_PUBLIC_URL:-}
      WINDCAST_PUBLIC_INDEXING: ${WINDCAST_PUBLIC_INDEXING:-false}
      # Seconds a successful backend response is shared between visitors (0 = off, max 60).
      WINDCAST_API_CACHE_SECONDS: ${WINDCAST_API_CACHE_SECONDS:-5}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"

volumes:
  db-data:
