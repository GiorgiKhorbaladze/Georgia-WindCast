<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="map.css">
<title>Georgia WindCast</title>
<script src="map.js" defer></script>
</head>
<body>
<main>
  <section id="stage" aria-labelledby="heading">
    <svg id="map" viewBox="0 0 1000 590" role="group" tabindex="0" aria-describedby="map-keys">
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38596f" stroke-opacity=".23"/></pattern>
        <linearGradient id="land" x2="0" y2="1"><stop stop-color="#214f63"/><stop offset="1" stop-color="#112c42"/></linearGradient>
        <radialGradient id="water" cx=".55" cy=".52" r=".75"><stop stop-color="#15304a"/><stop offset=".6" stop-color="#0b1a2c"/><stop offset="1" stop-color="#060e19"/></radialGradient>
        <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop stop-color="#5fe3cf" stop-opacity=".16"/><stop offset="1" stop-color="#5fe3cf" stop-opacity="0"/></radialGradient>
        <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <rect width="100%" height="100%" fill="url(#water)"/>
      <rect width="100%" height="100%" fill="url(#grid)"/>
      <ellipse cx="560" cy="300" rx="430" ry="230" fill="url(#glow)"/>
      <g id="camera"></g>
    </svg>
    <header class="brand"><span class="pulse"></span><span>GEORGIA WINDCAST</span><small id="mode"></small></header>
    <button id="expand" class="expand" type="button"></button>
    <div class="wind glass">
      <h1 id="heading"></h1>
      <div class="reading"><output id="wind"></output><span>MW</span></div>
      <svg id="trend" viewBox="0 0 280 48" role="img"><path id="spark"/></svg>
      <div class="trend-meta"><span id="trend-label"></span><span id="delta"></span></div>
      <small id="source-time"></small>
      <small id="wind-quality" hidden></small>
    </div>
    <div id="site-info" class="glass" hidden><strong id="site-name"></strong><small id="site-detail"></small><button id="close-site" type="button">×</button></div>
    <div class="map-tools" role="group">
      <button id="plus" type="button">+</button><button id="minus" type="button">−</button><button id="reset" type="button">↺</button>
    </div>
    <p id="map-keys" class="sr-only"></p>
    <div class="stage-bottom">
      <div class="mix glass" id="mix-panel">
        <div class="mixbar" id="mixbar" role="img"></div>
        <div class="mix-legend" id="mix-legend"></div>
      </div>
      <div id="national" class="strip glass"></div>
      <div class="playback glass">
        <button id="play" type="button"></button><label class="sr-only" for="time"></label>
        <input id="time" type="range" min="0" value="0">
        <label class="sr-only" for="speed"></label><select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select>
        <button id="latest" type="button"></button>
      </div>
    </div>
  </section>
  <section class="details" aria-labelledby="balance-heading">
    <div class="section-head"><h2 id="balance-heading"></h2><small id="retrieved"></small></div>
    <div id="mix" class="strip"></div>
    <div class="reconciliation"><p id="closure"></p><p id="closure-note" hidden></p></div>
    <p id="fetch-status" hidden></p>
    <p id="test-only" class="test-only" role="status" hidden></p>
    <div class="exchanges"><article id="imports" class="flow-panel" data-direction="import"></article><article id="exports" class="flow-panel" data-direction="export"></article></div>
    <p id="line-gate" class="line-gate"></p>
    <footer><a href="https://www.gse.com.ge/" target="_blank" rel="noopener">GSE</a> · <a id="provenance" href="https://github.com/GiorgiKhorbaladze/Georgia-WindCast/blob/main/docs/sources/system-snapshot.md" target="_blank" rel="noopener"></a></footer>
  </section>
</main>
</body>
</html>
