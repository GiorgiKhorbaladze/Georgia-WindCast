name: Collect GSE wind data

# Durable history for the Streamlit edition (streamlit_cloud/README.md, "Persistence").
# Runs only trusted code from the default branch (schedule/dispatch; never on pull requests) and
# writes daily CSV files to the separate `data` branch. GitHub may delay or skip scheduled runs;
# each run attempts bounded recovery within the last 12 hours. Longer outages, abandoned 404s
# and unavailable upstream files can leave gaps. Pushes made with GITHUB_TOKEN do not trigger other workflows.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Backfill window in hours (max 48; GSE retention is irregular beyond that)"
        default: "12"

permissions:
  contents: read

concurrency:
  group: collect-gse
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # repository-scoped permission; the script targets the data branch
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          path: code
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.32"
      - name: Install collector dependencies (pinned)
        run: |
          uv venv -p 3.12 venv
          uv pip install -p venv -r code/streamlit_cloud/collector-requirements.txt
      - name: Check out the data branch (created empty on first run)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git init -q data && cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://github.com/$REPO.git"
          if git -c http.extraheader="$auth" ls-remote --exit-code --heads origin data >/dev/null; then
            git -c http.extraheader="$auth" fetch -q --depth 1 origin data
            git checkout -q -b data FETCH_HEAD
          else
            git checkout -q --orphan data
            printf '%s\n' "# Georgia WindCast data branch" "" \
              "Written only by .github/workflows/collect-gse.yml. Daily CSV files of the GSE" \
              "national wind aggregate (UTC labels), see streamlit_cloud/README.md on main." > README.md
          fi
      - name: Collect
        id: collect
        env:
          LOOKBACK: ${{ github.event.inputs.lookback_hours || '12' }}
        run: |
          case "$LOOKBACK" in ''|*[!0-9]*) echo "lookback must be an integer"; exit 1;; esac
          [ "$LOOKBACK" -ge 1 ] && [ "$LOOKBACK" -le 48 ] || { echo "lookback above 48 h"; exit 1; }
          set +e
          venv/bin/python code/streamlit_cloud/collector.py --data-dir data \
            --lookback-hours "$LOOKBACK" --max-requests 1000 --weather
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Commit and push (only when something changed)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd data
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "GSE data $(date -u +%Y-%m-%dT%H:%MZ)"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          for i in 1 2 3 4; do
            git -c http.extraheader="$auth" push -q origin data && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: Fail visibly on integrity refusal or prolonged outage
        if: steps.collect.outputs.code != '0'
        run: |
          echo "collector exit code ${{ steps.collect.outputs.code }} (1 = data refused, 2 = source unreachable)"
          exit 1
