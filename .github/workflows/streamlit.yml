name: Streamlit pilot
on:
  push:
    branches: [main, work/streamlit-cloud]
    paths: ['streamlit_cloud/**', 'backend/app/**', '.streamlit/**', '.github/workflows/streamlit.yml']
  pull_request:
    paths: ['streamlit_cloud/**', 'backend/app/**', '.streamlit/**', '.github/workflows/streamlit.yml']
permissions:
  contents: read
jobs:
  streamlit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r streamlit_cloud/requirements.txt pytest==8.4.2
      - run: python -m pytest streamlit_cloud/tests -q
