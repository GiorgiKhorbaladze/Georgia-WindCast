name: Security

# Static security gates (docs/security/SECURITY-REPORT.md). Everything runs on the GitHub runner
# with pinned, verified tools (scripts/security/install-tools.sh). No code or findings are sent to
# any external SaaS: Semgrep runs locally without login/metrics, TruffleHog without verification.
on:
  pull_request:
    branches: [main, "claude/**"]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"  # weekly: new CVEs appear in unchanged images and lockfiles
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (TruffleHog, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0  # every commit, not just the head
      - run: scripts/security/install-tools.sh trufflehog
      - name: Gate - any secret candidate (values are never printed)
        run: scripts/security/scan.sh secrets
      - name: Upload redacted report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secrets-report-redacted
          path: security-reports/trufflehog-redacted.json
          if-no-files-found: ignore

  semgrep:
    name: SAST (Semgrep, pinned rules + project rules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: scripts/security/install-tools.sh semgrep
      - name: Gate - ERROR-severity findings
        run: scripts/security/scan.sh semgrep
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-report
          path: security-reports/semgrep.json
          if-no-files-found: ignore

  trivy:
    name: Dependencies, config and images (Trivy, cosign-verified)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: scripts/security/install-tools.sh trivy
      - name: Gate - lockfiles, Dockerfiles, secrets (fixable HIGH/CRITICAL)
        run: scripts/security/scan.sh trivy-fs
      - name: Build production images (amd64; OS updates applied, fail closed)
        run: |
          docker build -q -t windcast-postgres:scan deploy/postgres
          docker build -q -t windcast-backend:scan backend
          docker build -q -t windcast-frontend:scan frontend
          docker build -q -t windcast-caddy:scan deploy/caddy
      - name: Gate - images (fixable CRITICAL; HIGH reported)
        run: scripts/security/scan.sh trivy-image windcast-postgres:scan windcast-backend:scan windcast-frontend:scan windcast-caddy:scan
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-reports
          path: security-reports/trivy-*.json
          if-no-files-found: ignore
