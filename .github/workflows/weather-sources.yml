name: Independent weather sources (GFS, ECMWF IFS)

# Issue #57 (owner decision 21.11.2026): forecasts from NOAA GFS and ECMWF IFS open data on AWS
# Open Data, plus a Visual Crossing free-tier pilot (repository secret, 7 requests a day). GFS/IFS from AWS
# Open Data (no API key, no cost), at the seven forecasting points, so forecasting does not depend
# on a single provider and the sources can be compared. Hourly wake; each newly published run is
# stored once (about 4 runs a day per source; roughly 150-250 MB of GRIB downloaded per new run,
# only the needed fields via HTTP Range). Writes only the forecast-data branch. No publication.
on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forecast-data  # never pushes at the same time as forecast.yml / the tournament
  cancel-in-progress: false

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # repository-scoped permission; the script writes only the forecast-data branch
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          path: code
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.32"
      - name: Install pinned dependencies (ecCodes with its bundled library)
        run: |
          uv venv -p 3.12 venv
          uv pip install -p venv -r code/streamlit_cloud/forecast-weather-requirements.txt
      - name: Check out forecast-data
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git init -q out && cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://github.com/$REPO.git"
          git -c http.extraheader="$auth" fetch -q --depth 1 origin forecast-data
          git checkout -q -b forecast-data FETCH_HEAD
      - name: Collect new runs (each source independently)
        working-directory: code/streamlit_cloud
        env:
          VISUAL_CROSSING_API_KEY: ${{ secrets.VISUAL_CROSSING_API_KEY }}  # pilot; once a day, free tier
        run: ../../venv/bin/python -m forecasting.run sources --data-dir ../../out --out-dir ../../out
      - name: Commit and push (only when something changed)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git add -A weather
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "weather sources $(date -u +%Y-%m-%dT%H:%MZ)"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          for i in 1 2 3 4; do
            git -c http.extraheader="$auth" push -q origin forecast-data && exit 0
            sleep $((i * 5))
          done
          exit 1
