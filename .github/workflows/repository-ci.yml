name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify bootstrap files and whitespace
        run: |
          test -s README.md
          test -s .gitignore
          test -s docs/PROJECT.md
          git show --format= --check HEAD
