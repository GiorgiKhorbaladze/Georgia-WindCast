name: CI

on:
  push:
    branches: [main]
  pull_request:
    # main, plus stacked PRs onto integration branches (e.g. the #18 PR onto the release candidate)
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Job names are the stable check names referenced in docs/adr/0001-foundation-stack.md.
# No job contacts GSE, Open-Meteo or any other upstream data source.
jobs:
  frontend:
    name: Frontend (lint, typecheck, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.5
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  streamlit-demo:
    name: Streamlit demo (lint, tests, offline page render)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            streamlit_app/requirements.txt
      - name: Lint (backend ruff rules)
        run: uv run --project backend --frozen ruff check streamlit_app && uv run --project backend --frozen ruff format --check streamlit_app
      - name: Install the exact Community Cloud requirements
        run: |
          uv venv -p 3.12 .demo-venv
          uv pip install -p .demo-venv -r streamlit_app/requirements.txt pytest==9.2.0
      - name: Tests (recorded payloads; no upstream is contacted)
        working-directory: streamlit_app
        run: ../.demo-venv/bin/python -m pytest -q tests

  backend:
    name: Backend (lint, typecheck, tests, migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.12-alpine3.24@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
        env:
          POSTGRES_USER: windcast
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: windcast_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U windcast -d windcast_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://windcast:ci-only-password@localhost:5432/windcast_test
      WINDCAST_DATABASE_URL: postgresql+psycopg://windcast:ci-only-password@localhost:5432/windcast_test
      WINDCAST_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -v
      - name: Migrations apply cleanly from empty and round-trip
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [frontend, backend]
    services:
      postgres:
        image: postgres:17.12-alpine3.24@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
        env:
          POSTGRES_USER: windcast
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: windcast_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U windcast -d windcast_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      WINDCAST_APP_ENV: test
      WINDCAST_DATABASE_URL: postgresql+psycopg://windcast:ci-only-password@localhost:5432/windcast_e2e
      # Seeded readings are re-timestamped once; a wider window keeps them "fresh" for the run.
      WINDCAST_GSE_FRESH_WITHIN_SECONDS: "3600"
      BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.5
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and start the production frontend (API started next)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          # Cache off: scenario steps reseed the database between runs (the cache has unit tests).
          WINDCAST_API_CACHE_SECONDS=0 WINDCAST_API_URL=http://127.0.0.1:8000 nohup npx next start -p 3000 > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/healthz && break; sleep 1; done
      - name: Start API on a seeded test database (test-only seed, real recorded values)
        working-directory: backend
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run python -m tests.e2e_seed
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health/ready && break; sleep 1; done
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser tests (desktop + mobile, a11y), seeded data
        working-directory: frontend
        run: npx playwright test --trace off
      - name: Browser tests, stale / zero / forecast-expired / site-missing / empty scenarios
        run: |
          (cd backend && uv run python -m tests.e2e_seed --stale)
          (cd frontend && E2E_SCENARIO=stale npx playwright test e2e/scenarios.spec.ts --trace off)
          (cd backend && uv run python -m tests.e2e_seed --zero)
          (cd frontend && E2E_SCENARIO=zero npx playwright test e2e/scenarios.spec.ts --trace off)
          (cd backend && uv run python -m tests.e2e_seed --forecast-expired)
          (cd frontend && E2E_SCENARIO=forecast-expired npx playwright test e2e/scenarios.spec.ts --trace off)
          (cd backend && uv run python -m tests.e2e_seed --site-missing)
          (cd frontend && E2E_SCENARIO=site-missing npx playwright test e2e/scenarios.spec.ts --trace off)
          (cd backend && uv run python -m tests.e2e_seed --clear)
          (cd frontend && E2E_EMPTY=1 npx playwright test e2e/empty.spec.ts --trace off)
      - name: Upload Playwright report and server logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            api.log
            web.log

  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Run smoke test (isolated project, random password)
        shell: bash
        run: scripts/compose-smoke.sh 2>&1 | tee compose-smoke.txt
      - name: Upload smoke transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compose-smoke-transcript
          path: compose-smoke.txt

  public-edge-smoke:
    name: Public edge smoke (HTTPS, rate limits, exposure)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Caddy + production overlays (isolated project, internal CA, random password)
        shell: bash
        run: scripts/edge-smoke.sh 2>&1 | tee edge-smoke.txt
      - name: Upload transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edge-smoke-transcript
          path: edge-smoke.txt

  arm64:
    name: ARM64 images (build + emulated smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [frontend, backend]
    env:
      # DOCKER_DEFAULT_PLATFORM is set only on the smoke steps: job-wide it made
      # setup-qemu-action pull its own binfmt helper as arm64 ("exec format error").
      WINDCAST_IMAGE_TAG: arm64
      SMOKE_SKIP_BUILD: "1"
      # Emulation only: relaxed healthcheck timeouts. Native Ampere A1 hosts do not use this file.
      SMOKE_EXTRA_COMPOSE: deploy/emulation.yaml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build linux/arm64 images (postgres, backend, frontend, Caddy)
        run: |
          docker buildx build --platform linux/arm64 --load -t windcast-postgres:arm64 deploy/postgres
          docker buildx build --platform linux/arm64 --load -t windcast-backend:arm64 backend
          docker buildx build --platform linux/arm64 --load -t windcast-frontend:arm64 frontend
          docker buildx build --platform linux/arm64 --load -t windcast-caddy:arm64 deploy/caddy
          for i in windcast-postgres:arm64 windcast-backend:arm64 windcast-frontend:arm64 windcast-caddy:arm64; do
            echo "$i $(docker image inspect "$i" --format '{{.Architecture}} {{.Size}}')"
            test "$(docker image inspect "$i" --format '{{.Architecture}}')" = arm64
          done
      - name: Trivy on the arm64 images (same gate as the Security workflow)
        run: |
          scripts/security/install-tools.sh trivy
          scripts/security/scan.sh trivy-image windcast-postgres:arm64 windcast-backend:arm64 windcast-frontend:arm64 windcast-caddy:arm64
      - name: Compose smoke on arm64 (migrations, production overlay, failing + successful restore)
        shell: bash
        env:
          DOCKER_DEFAULT_PLATFORM: linux/arm64
        run: scripts/compose-smoke.sh 2>&1 | tee arm64-compose-smoke.txt
      - name: Public edge smoke on arm64
        shell: bash
        env:
          DOCKER_DEFAULT_PLATFORM: linux/arm64
        run: scripts/edge-smoke.sh 2>&1 | tee arm64-edge-smoke.txt
      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arm64-transcripts
          path: arm64-*.txt

  rollback-rehearsal:
    name: Rollback rehearsal (cross-schema, broken migration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0  # the rehearsal clones this checkout and commits test revisions on top
      - name: Deploy A, deploy B (incompatible schema), rollback; deploy C (broken), rollback
        shell: bash
        run: scripts/rollback-rehearsal.sh 2>&1 | tee rollback-rehearsal.txt
      - name: Upload transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rollback-rehearsal-transcript
          path: rollback-rehearsal.txt
