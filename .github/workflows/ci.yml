name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Job names are the stable check names referenced in docs/adr/0001-foundation-stack.md.
# No job contacts GSE, Open-Meteo or any other upstream data source.
jobs:
  frontend:
    name: Frontend (lint, typecheck, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend (lint, typecheck, tests, migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.7-alpine3.22
        env:
          POSTGRES_USER: windcast
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: windcast_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U windcast -d windcast_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://windcast:ci-only-password@localhost:5432/windcast_test
      WINDCAST_DATABASE_URL: postgresql+psycopg://windcast:ci-only-password@localhost:5432/windcast_test
      WINDCAST_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -v
      - name: Migrations apply cleanly from empty and round-trip
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v6
      - name: Run smoke test (isolated project, random password)
        shell: bash
        run: scripts/compose-smoke.sh 2>&1 | tee compose-smoke.txt
      - name: Upload smoke transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke-transcript
          path: compose-smoke.txt
