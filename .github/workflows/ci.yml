name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Job names are the stable check names referenced in docs/adr/0001-foundation-stack.md.
# No job contacts GSE, Open-Meteo or any other upstream data source.
jobs:
  frontend:
    name: Frontend (lint, typecheck, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend (lint, typecheck, tests, migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.7-alpine3.22
        env:
          POSTGRES_USER: windcast
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: windcast_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U windcast -d windcast_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://windcast:ci-only-password@localhost:5432/windcast_test
      WINDCAST_DATABASE_URL: postgresql+psycopg://windcast:ci-only-password@localhost:5432/windcast_test
      WINDCAST_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -v
      - name: Migrations apply cleanly from empty and round-trip
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [frontend, backend]
    services:
      postgres:
        image: postgres:17.7-alpine3.22
        env:
          POSTGRES_USER: windcast
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: windcast_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U windcast -d windcast_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      WINDCAST_APP_ENV: test
      WINDCAST_DATABASE_URL: postgresql+psycopg://windcast:ci-only-password@localhost:5432/windcast_e2e
      BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v6
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start API on a seeded test database (test-only seed, real recorded values)
        working-directory: backend
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run python -m tests.e2e_seed
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health/ready && break; sleep 1; done
      - name: Build and start the production frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          WINDCAST_API_URL=http://127.0.0.1:8000 nohup npx next start -p 3000 > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/healthz && break; sleep 1; done
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser tests (desktop + mobile, a11y), seeded data
        working-directory: frontend
        run: npx playwright test --trace off
      - name: Browser tests, empty database (explicit unavailable states)
        run: |
          (cd backend && uv run python -m tests.e2e_seed --clear)
          cd frontend && E2E_EMPTY=1 npx playwright test e2e/empty.spec.ts --trace off
      - name: Upload Playwright report and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            api.log
            web.log

  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v6
      - name: Run smoke test (isolated project, random password)
        shell: bash
        run: scripts/compose-smoke.sh 2>&1 | tee compose-smoke.txt
      - name: Upload smoke transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke-transcript
          path: compose-smoke.txt
