name: Issue and score experimental wind forecasts

# Issue #57 stage I. Runs right after each GSE collection (no request to GSE or any weather
# provider: it only reads the `data` branch) and writes to its own `forecast-data` branch, so it
# can never interfere with the collector's pushes. Nothing here publishes a forecast on the
# website; streamlit_cloud/mwmodel.py PUBLISH_FORECAST stays False.
on:
  workflow_run:
    workflows: ["Collect GSE wind data"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force_evaluate:
        description: "Re-score now even if the last evaluation is recent"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: forecast-data
  cancel-in-progress: false

jobs:
  forecast:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # repository-scoped permission; the script writes only the forecast-data branch
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          path: code
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.32"
      - name: Install dependencies (pinned)
        run: |
          uv venv -p 3.12 venv
          uv pip install -p venv -r code/streamlit_cloud/forecast-requirements.txt
      - name: Check out data (read only) and forecast-data (created empty on first run)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git init -q data && git -C data remote add origin "https://github.com/$REPO.git"
          git -C data -c http.extraheader="$auth" fetch -q --depth 1 origin data
          git -C data checkout -q FETCH_HEAD -- gse
          git init -q out && cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://github.com/$REPO.git"
          if git -c http.extraheader="$auth" ls-remote --exit-code --heads origin forecast-data >/dev/null; then
            git -c http.extraheader="$auth" fetch -q --depth 1 origin forecast-data
            git checkout -q -b forecast-data FETCH_HEAD
          else
            git checkout -q --orphan forecast-data
            printf '%s\n' "# Georgia WindCast experimental forecasts" "" \
              "Written only by .github/workflows/forecast.yml (Issue #57). Append-only ledger," \
              "rolling-origin backtest and scores. Not published on the website." > README.md
          fi
      - name: Issue, backtest (incremental) and evaluate (at most hourly)
        env:
          FORCE: ${{ github.event.inputs.force_evaluate == 'true' && '--force' || '' }}
        working-directory: code/streamlit_cloud
        run: |
          ../../venv/bin/python -m forecasting.run issue --data-dir ../../data --out-dir ../../out
          ../../venv/bin/python -m forecasting.run backtest --data-dir ../../data --out-dir ../../out
          ../../venv/bin/python -m forecasting.run evaluate --data-dir ../../data --out-dir ../../out $FORCE
      - name: Commit and push (only when something changed)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "forecasts $(date -u +%Y-%m-%dT%H:%MZ)"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          for i in 1 2 3 4; do
            git -c http.extraheader="$auth" push -q origin forecast-data && exit 0
            sleep $((i * 5))
          done
          exit 1
