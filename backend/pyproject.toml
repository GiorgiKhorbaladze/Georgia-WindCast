[project]
name = "windcast-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.121.2", "uvicorn==0.38.0", "psycopg[binary]==3.2.12", "alembic==1.17.2", "sqlalchemy==2.0.44"]

[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.14.5"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
